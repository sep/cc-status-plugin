title: ClaudePanel
description: External hardware status display for Claude Code sessions.
theme: jekyll-theme-cayman

# url + baseurl deliberately omitted — GitHub Pages injects the right
# values for project sites (https://<org>.github.io/<repo>). Setting
# them manually had been breaking Cayman's stylesheet link.

show_downloads: false

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
