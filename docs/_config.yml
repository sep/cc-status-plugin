title: ClaudePanel
description: External hardware status display for Claude Code sessions.
theme: jekyll-theme-cayman

# url + baseurl deliberately omitted — GitHub Pages injects the right
# values for project sites (https://<org>.github.io/<repo>). Setting
# them manually had been breaking Cayman's stylesheet link.

show_downloads: false

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# ---------------------------------------------------------------------------
# Cross-project URLs — referenced from index.md via {{ site.<name> }}.
#
# Repos are public, so Pages serves at the predictable
# `https://<org>.github.io/<repo>/` form. (While they were private,
# these were obfuscated `*.pages.github.io` slugs.) If a custom domain
# lands later, update the `_site` values here once and Jekyll rebuilds
# the page with every link updated — no link audits across markdown.
#
# Verify current values with:
#   gh api repos/sep/<repo-name>/pages
# ---------------------------------------------------------------------------

bridge_repo:    https://github.com/sep/cc-status-bridge
bridge_site:    https://sep.github.io/cc-status-bridge/

firmware_repo:  https://github.com/sep/cc-status-display
firmware_site:  https://sep.github.io/cc-status-display/

plugin_repo:    https://github.com/sep/cc-status-plugin
